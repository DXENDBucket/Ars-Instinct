plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.146' }
group = 'dev.arsinstinct'
version = file('VERSION').text.trim()
base { archivesName = 'ars-instinct' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets {
    main { java.srcDir 'common/src/main/java'; resources.srcDir 'common/src/main/resources' }
    gameTest { java.srcDir 'common/src/gameTest/java'; compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output }
}
configurations { gameTestImplementation.extendsFrom implementation; gameTestCompileOnly.extendsFrom compileOnly; gameTestRuntimeOnly.extendsFrom runtimeOnly }
evaluationDependsOn(':ars-conflux')
def core = project(':ars-conflux').sourceSets.main
neoForge {
    version = '21.1.250'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ars_instinct'
            jvmArgument '-Xmx1000m'
        }
    }
    mods { ars_conflux { sourceSet core }; ars_instinct { sourceSet sourceSets.main; sourceSet sourceSets.gameTest } }
}
dependencies {
    implementation project(':ars-conflux')
    compileOnly fileTree(dir: '../Ars-Conflux/libs', include: ['ars*.jar','curios.jar','geckolib.jar'])
    runtimeOnly fileTree(dir: '../Ars-Conflux/libs', include: ['ars.jar','curios.jar','geckolib.jar'])
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('META-INF/neoforge.mods.toml') { expand(version:project.version) } }
tasks.named('jar') { from('LICENSE'); archiveFileName = "ars-instinct-${version}-mc1.21.1-neoforge.jar" }
tasks.named('sourcesJar') { from('LICENSE') }
