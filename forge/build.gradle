plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.36' }
group='dev.arsinstinct'
version=file('../VERSION').text.trim()
base { archivesName='ars-instinct' }
java { toolchain.languageVersion=JavaLanguageVersion.of(17); withSourcesJar() }
sourceSets.main { java.srcDir '../common/src/main/java'; resources.srcDir '../common/src/main/resources' }
repositories { flatDir { dirs '../../Ars-Conflux/forge/libs' }; mavenCentral { content { excludeGroup 'local' } } }
sourceSets { gameTest { java.srcDir '../common/src/gameTest/java'; compileClasspath+=sourceSets.main.output; runtimeClasspath+=sourceSets.main.output; resources.srcDir '../src/gameTest/resources' } }
configurations { gameTestImplementation.extendsFrom implementation; gameTestRuntimeOnly.extendsFrom runtimeOnly }
evaluationDependsOn(':ars-conflux')
def core=project(':ars-conflux').sourceSets.main
minecraft {
 mappings channel:'official',version:'1.20.1'
 runs { gameTestServer {
  workingDirectory project.file('run/gametest');jvmArgs '-Xmx1000m'
  property 'forge.enabledGameTestNamespaces','ars_instinct'
  property 'mixin.env.remapRefMap','true'
  property 'mixin.env.refMapRemappingFile',"${projectDir}/build/createSrgToMcp/output.srg"
  args '--mixin.config','ars_conflux.mixins.json'
  mods { ars_conflux { source core }; ars_instinct { source sourceSets.main; source sourceSets.gameTest } }
 } }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    implementation project(':ars-conflux')
    for(name in ['ars-nouveau','geckolib','curios','patchouli']) implementation fg.deobf("local:${name}:forge1201")
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('META-INF/mods.toml') { expand(version:project.version) } }
tasks.named('jar') { from('../LICENSE'); archiveFileName="ars-instinct-${version}-mc1.20.1-forge.jar"; finalizedBy 'reobfJar' }
tasks.named('sourcesJar') { from('../LICENSE') }
